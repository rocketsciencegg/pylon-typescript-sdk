name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc
      # `dist/` is COMMITTED, because consumers install this over `github:` and there is no `prepare`
      # build (one used to exist and broke installs — see #8). That makes the checked-in output the
      # actual published artifact, so it has to be verified: if someone edits api.ts and forgets to
      # rebuild, every consumer silently gets stale code and nothing anywhere complains.
      - name: committed dist/ must match a fresh build
        run: git diff --exit-code dist/ || (echo "::error::dist/ is stale — run 'pnpm exec tsc' and commit dist/" && exit 1)

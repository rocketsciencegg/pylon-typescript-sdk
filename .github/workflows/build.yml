name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Restore by default. cache-mode is an enum (not an expression), so the only
# writer is the separate push-to-main job below.
cache-mode: read

jobs:
  build:
    runs-on: ubuntu-latest
    # pull_request runs this job. Token is contents: read only, and it does not push.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          # action-setup's own cache adds a restore-keys prefix. Leave it off.
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Resolve pnpm store cache key
        id: pnpm-cache-key
        run: |
          hash="${{ hashFiles('pnpm-lock.yaml') }}"
          if [ -z "$hash" ]; then
            echo "::error::pnpm-lock.yaml hash is empty; refusing a prefix cache key"
            exit 1
          fi
          echo "key=pnpm-store-${{ runner.os }}-${{ runner.arch }}-${hash}" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm store
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-cache-key.outputs.key }}
      # The cache service prefix-matches the primary key even with no
      # restore-keys. Keep the store only on an exact hit.
      - name: Discard non-exact pnpm store restore
        if: success() && steps.pnpm-cache.outputs.cache-hit != 'true'
        env:
          STORE: ${{ steps.pnpm-store.outputs.path }}
          MATCHED: ${{ steps.pnpm-cache.outputs.cache-matched-key }}
        run: |
          if [ -n "$MATCHED" ]; then
            echo "::warning::Discarding non-exact pnpm store restore ($MATCHED)"
          fi
          if [ -z "$STORE" ] || [ "$STORE" = "/" ]; then
            echo "::error::Refusing to delete unexpected pnpm store path"
            exit 1
          fi
          rm -rf -- "$STORE"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc
      # `dist/` is COMMITTED, because consumers install this over `github:` and there is no `prepare`
      # build (one used to exist and broke installs — see #8). That makes the checked-in output the
      # actual published artifact, so it has to be verified: if someone edits api.ts and forgets to
      # rebuild, every consumer silently gets stale code and nothing anywhere complains.
      - name: committed dist/ must match a fresh build
        run: git diff --exit-code dist/ || (echo "::error::dist/ is stale — run 'pnpm exec tsc' and commit dist/" && exit 1)

  cache-pnpm-store:
    name: Cache pnpm store
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    cache-mode: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Resolve pnpm store cache key
        id: pnpm-cache-key
        run: |
          hash="${{ hashFiles('pnpm-lock.yaml') }}"
          if [ -z "$hash" ]; then
            echo "::error::pnpm-lock.yaml hash is empty; refusing a prefix cache key"
            exit 1
          fi
          echo "key=pnpm-store-${{ runner.os }}-${{ runner.arch }}-${hash}" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm store
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-cache-key.outputs.key }}
      - name: Discard non-exact pnpm store restore
        if: success() && steps.pnpm-cache.outputs.cache-hit != 'true'
        env:
          STORE: ${{ steps.pnpm-store.outputs.path }}
          MATCHED: ${{ steps.pnpm-cache.outputs.cache-matched-key }}
        run: |
          if [ -n "$MATCHED" ]; then
            echo "::warning::Discarding non-exact pnpm store restore ($MATCHED)"
          fi
          if [ -z "$STORE" ] || [ "$STORE" = "/" ]; then
            echo "::error::Refusing to delete unexpected pnpm store path"
            exit 1
          fi
          rm -rf -- "$STORE"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Save pnpm store
        if: success() && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-cache-key.outputs.key }}

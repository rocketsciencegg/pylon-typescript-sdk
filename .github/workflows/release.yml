name: Release
on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'What changed in the API spec'
        required: true
        type: string

permissions:
  contents: read

# This job tags and publishes a GitHub release. A restored pnpm store is code
# execution here, so it neither restores nor saves a cache.
cache-mode: none

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag push below uses this credential. Build checkouts set this false.
          persist-credentials: true
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc
      - name: Get version
        id: version
        # A block scalar, not a one-liner. The previous form escaped its inner quotes
        # as \" inside a YAML plain scalar, which reaches bash literally and dies with
        # `syntax error near unexpected token '('`. Every release run failed on it.
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
      - name: Create GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "v${{ steps.version.outputs.version }}"
          body: ${{ github.event.inputs.release_notes }}
          generate_release_notes: true

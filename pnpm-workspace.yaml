# Supply-chain cooldown: refuse any package version published less than 7 days ago.
#
# 10080 minutes = 7 days. Most malicious npm publishes are caught and yanked within
# hours, so simply not being first to install a fresh version removes most of that
# exposure. If an urgent version is genuinely needed, pin it and wait the week out
# rather than removing the guard.
#
# pnpm 12 reads project settings from pnpm-workspace.yaml, so the guard lives here.
# The age check applies to every dependency.
minimumReleaseAge: 10080
